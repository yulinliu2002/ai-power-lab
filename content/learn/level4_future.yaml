# Level 4 -- Future Deep Dives. Roadmap placeholders only -- "future
# only" per CLAUDE.md / the V1.1 brief. These are intentionally light:
# framework first, depth later. Not implemented in V1/V1.1.

- id: sic-gan-devices
  title: SiC / GaN Device Physics
  level: 4-future
  what_is_it: >
    The semiconductor physics of wide-bandgap switching devices (Silicon
    Carbide, Gallium Nitride) increasingly used in modern SST and power-
    conversion designs.
  why_it_exists: >
    Device choice drives achievable switching frequency, efficiency, and
    power density -- a major real engineering decision this project does
    not model.
  how_modeled: >
    NOT implemented. This project has no semiconductor device model of
    any kind -- see CLAUDE.md's explicit out-of-scope list.
  industry_relevance: >
    Wide-bandgap devices are widely cited across the power-electronics
    industry as key enablers of smaller, more efficient SST designs.
  try_it_scenario: null

- id: switching-modulation
  title: Switching & Modulation
  level: 4-future
  what_is_it: >
    The PWM/modulation strategies that control individual semiconductor
    switching within each SST stage.
  why_it_exists: >
    Modulation strategy affects switching loss, harmonic content, and
    achievable control bandwidth at the device level.
  how_modeled: >
    NOT implemented. This project's SST is an average-value model with
    no switching-level representation at all.
  industry_relevance: >
    An active research and product-differentiation area for SST and
    general power-conversion design.
  try_it_scenario: null

- id: mft-electromagnetic-design
  title: MFT Electromagnetic Design
  level: 4-future
  what_is_it: >
    Detailed core/winding design of the medium-frequency transformer
    introduced conceptually in Level 2.
  why_it_exists: >
    Real MFT design involves core material selection, winding loss,
    leakage inductance, and insulation design -- widely cited as one of
    the hardest parts of practical SST engineering.
  how_modeled: NOT implemented. No magnetics or electromagnetic model exists in this project.
  industry_relevance: >
    Frequently identified in SST literature as a key bottleneck to
    commercialization.
  try_it_scenario: null

- id: emi
  title: EMI
  level: 4-future
  what_is_it: >
    Electromagnetic interference generated by high-frequency switching,
    and the filtering/shielding needed to control it.
  why_it_exists: >
    Real converters must meet EMI standards; this is a significant
    design constraint entirely absent from an average-value model.
  how_modeled: NOT implemented.
  industry_relevance: >
    A standard, significant part of real power-converter certification
    and design.
  try_it_scenario: null

- id: detailed-semiconductor-loss
  title: Detailed Semiconductor Loss
  level: 4-future
  what_is_it: >
    Device-level conduction and switching loss models (as opposed to
    this project's single constant efficiency number).
  why_it_exists: >
    Real losses vary with load current, switching frequency, and
    temperature -- captured here only as a placeholder for future,
    more detailed work.
  how_modeled: >
    NOT implemented. See Efficiency / Loss in Level 3 for the current
    constant-efficiency treatment and its limitations.
  industry_relevance: >
    Central to real converter efficiency optimization and thermal
    design.
  try_it_scenario: null

- id: detailed-control-loops
  title: Detailed Control Loops
  level: 4-future
  what_is_it: >
    Multi-loop, model-based, or otherwise more sophisticated control
    architectures than this project's single PI + feedforward loop.
  why_it_exists: >
    Real SSTs often use cascaded or multi-objective control (voltage,
    current, power-factor, balancing) well beyond a single PI loop.
  how_modeled: >
    NOT implemented. See PI Control in Level 1 for the current
    controller and its stated limitations.
  industry_relevance: >
    An active area of comparison in power-electronics control research
    (e.g. model predictive control vs. classical PI baselines).
  try_it_scenario: null
